name: Tests
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: tests
      - name: Security rules
        working-directory: tests
        run: |
          cp ../firebase.json ../firestore.rules .
          npx firebase emulators:exec --only firestore --project demo-events "node rules.test.mjs firestore.rules"
      - name: Reminder limits
        working-directory: tests
        run: npx firebase emulators:exec --only firestore --project demo-events "node reminders.test.mjs"
      - run: pip install pillow
      - name: Full browser run
        working-directory: tests
        env:
          EVENTS_ROOT: ${{ github.workspace }}
          TZ: America/New_York
        run: npx firebase emulators:exec --only firestore,auth --project demo-events "node e2e.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: /tmp/events-shots/*.png, retention-days: 3 }

  # Publish to steele-events.web.app after the tests pass on main, so pushed changes go live without a manual deploy.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && 'yes' || 'no' }}
    steps:
      - if: env.HAS_KEY != 'yes'
        run: echo "No FIREBASE_SERVICE_ACCOUNT secret yet, so skipping publish. Publish by hand with npx firebase-tools deploy --only hosting --project steele-events."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'yes'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_KEY == 'yes'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: steele-events
          channelId: live
